<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Applies a saved light-theme choice before first paint — see
         useTheme.ts's own doc comment for why this can't just wait for Vue
         to mount. Deliberately inline and non-module: this has to run
         synchronously, before the browser paints anything. Same
         'jax:theme'/'light' contract the original static site used. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('jax:theme') === 'light') document.documentElement.dataset.theme = 'light';
        } catch (e) {}
      })();
    </script>
    <title>Jax · Group Ironman hiscores</title>
    <meta
      name="description"
      content="Live RuneScape 3 hiscore standings for the Jax group ironman team — skill matrix, standings and experience gained."
    />
    <meta name="theme-color" content="#0c0a09" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0a09'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23d95926' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <noscript>
      <p class="loading">
        This scoreboard renders live hiscore data in the browser and needs JavaScript enabled.
        The underlying data is readable directly at <code>/api/latest</code>.
      </p>
    </noscript>
  </body>
</html>
