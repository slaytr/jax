name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Check stats/ pages are current
        run: |
          npm run stats
          if [ -n "$(git status --porcelain stats)" ]; then
            echo "stats/ is out of date with data/players.json — run 'npm run stats' and commit the result."
            git status --porcelain stats
            exit 1
          fi
