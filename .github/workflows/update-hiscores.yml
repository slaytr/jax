name: Update hiscores

# The RS3 hiscore feed sends no CORS headers, so the browser cannot call it.
# This job does the fetching server-side and commits the result as static JSON.

on:
  schedule:
    # Every six hours. GitHub queues cron jobs on a best-effort basis, so treat
    # the interval as approximate rather than exact.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/players.json'
      - 'scripts/**'
      - '.github/workflows/update-hiscores.yml'

permissions:
  contents: write

concurrency:
  group: update-hiscores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch hiscores
        run: node scripts/update.mjs

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No hiscore changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: hiscore snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
